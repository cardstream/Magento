<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice opn_method">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod"/>
        <label class="label" data-bind="attr: {'for': getCode()}">
            <span data-bind="text: getTitle()"></span>
        </label>
        <div class="cards_img">
            <img data-bind="attr: { src: require.toUrl('OPN_Payment/images/cards/image.png') }" />
        </div>
    </div>

    <style>
      .opn_method {display: flex;align-items: center;}
      .cards_img {padding-left: 11px;display: flex;}
      .cards_img img {height: 25px;width: auto;}
      .fields_text p {color: gray;padding:0;}
      .form-group { margin: 0px 0 15px 0;}
      .form-hostedfields .fields{ width: 400px; max-width:100%; margin-bottom: -10px;; }
      .form-group-fields{ flex-direction: row;  display: flex; gap: 20px; }
      .form-group LABEL { display: inline-block; max-width: 100%; margin-bottom: 5px; font-weight: bold; font-size: 12px;color: #454545;}
      .form-group label.error{ color:#d00; margin:3px 0 0 0; font-weight:normal; font-style:italic; font-size: 13px; }
      .form-control,.ccv.form-control,.hf-card-expiry-date { display: block; box-sizing: border-box; width: 100%; padding: 6px 12px !important; font-size: 14px !important; color: #555; background-color: #fff; background-image: none; border: 1px solid #ddd !important; border-radius: 4px !important; height: auto !important; }
      .has_methods{ margin-top: -15px;}
      .has_methods .box_opn_method{ padding-left: 25px;}
      .box_opnm_radio{ margin-top: 15px; }
      .box_creditcard fieldset{ margin-bottom: 0 !important;}
      .box_opn_method{ padding-bottom: 1px; padding-top: 10px; }
      .ccv.form-control{ padding:7px 12px !important; }
      select.select{  width: 250px; max-width: 100%; padding: 6px 10px 7px 10px; border: 1px solid #ddd; border-radius: 4px; display: block; height: auto; margin-bottom: 10px; }
      .opn-gpay-custom-btn{ display:flex; align-items:center; justify-content:center; gap:6px; width:240px; max-width:100%; height:40px; padding:5px 0; box-sizing:border-box; border:0; border-radius:5px; background:#000 !important; color:#fff !important; font-size:15px; font-weight:500; cursor:pointer; transition:opacity .15s; box-shadow:none; }
      .opn-gpay-custom-btn:hover, .opn-gpay-custom-btn:focus, .opn-gpay-custom-btn:active{ background:#000 !important; color:#fff !important; opacity:.85; box-shadow:none; border:0; }
      .opn-gpay-custom-btn svg{ flex:0 0 auto; }
    </style>

    <div data-bind="attr: { class: 'payment-method-content qidigital-payment-method ' +(hasMoreMethod() ? 'has_methods' :'') }">
     
        <form id="form" class="form-hostedfields form-address-edit" method="POST" novalidate="novalidate" lang="en">
          
          <!-- ko if: hasAvailMethod('card') -->

            <!-- ko if: hasMoreMethod() -->
            <div class="box_opnm_radio">
              <label for="inp_opn_method_card">
                <input type="radio"
                        id="inp_opn_method_card"
                        name="opn_method_id"
                        class="opn_method_id"
                        value="card"
                        data-bind="checked: method, event:{ change: changeMethod }" />
                <span data-bind="i18n: 'Credit / Debit Card'"></span>
              </label>
            </div>
            <!-- /ko -->

            <style class="hostedfield">
                .hostedfield:disabled { cursor: not-allowed;  background-color: #eee; opacity: 1; }
                .hostedfield{ padding:10px 10px !important; height:38px !important; }
                .hostedfield:valid { border-color: #28a745 !important; color: #28a745 !important; }
                .hf-user-invalid.hf-invalid:not(.hf-focus) { border-color: #d00 !important; color: #d00 !important; }
                .hostedfield:readonly { color: lightgrey !important; }
                .hostedfield.hf-autofill { color: rgb(0, 0, 0) !important; }
                .box_listcards{ padding-bottom:10px;}

                .box_listcards > div{ margin-bottom: 10px;}
                .box_listcards > div input{ margin-right: 5px; }
                .box_creditcard.has_cards, .box_ccv{ display: none; padding-left: 21px;}
                .box_creditcard.has_cards{ margin-top: -15px; }
                .box_ccv{ width: 150px; }
                .box_ccv .form-group{ margin-bottom: 15px; margin-top: 3px; }
                 iframe.hostedfield-frame{ max-height: 20px !important; }
              </style>
            <div class="box_opn_method" id="box_opn_method_card" data-bind="style: { display: method() == 'card' ? 'block' : 'none' }">
            
              <input type="hidden" name="merchantID" data-bind="value: merchantId"/>     
              
              <!-- ko if: getIntegrationType() == 'direct' -->

                <!-- ko if: hasCards -->
                  <div class="box_listcards">
                    <!-- ko foreach: { data: savedCards, as: 'card' } -->
                    <div>
                        <label data-bind="attr: { for: 'inp_opn_card_' + card.entity_id }">
                            <input type="radio"
                                  name="opn_card_id"
                                  class="opn_card_id"
                                  data-bind="
                                      attr: { id: 'inp_opn_card_' + card.entity_id, value: card.entity_id },
                                      checked: $parent.cardId,
                                      event:{ change: $parent.changeCard }
                                  " />
                            <span data-bind="text: card.card_number"></span>
                            (<!-- ko i18n: 'Expiry'--><!-- /ko -->: <span data-bind="text: card.card_expiry"></span>)
                        </label>

                        <div class="box_ccv"
                            data-bind="
                              attr: { id: 'box_ccv_' + card.entity_id }, 
                              style: { display: $parent.cardId() == card.entity_id ? 'block' : 'none' }
                            ">
                            <div class="form-group">
                                <label data-bind="i18n: 'Security Code'"></label>
                                <input type="tel" class="ccv form-control" maxlength="4" data-bind="value: $parent.ccv" placeholder="***" />
                            </div>
                        </div>
                    </div>
                    <!-- /ko -->

                    <!-- New card option -->
                    <div>
                        <label for="inp_opn_card_new">
                            <input type="radio"
                              id="inp_opn_card_new"
                              name="opn_card_id"
                              class="opn_card_id"
                              value="new"
                              data-bind="checked: cardId, event:{ change: changeCard }" />
                            <span data-bind="i18n: 'Use new card'"></span>

                        </label>
                    </div>
                  </div>
                <!-- /ko -->
   
                <div data-bind="attr: { class: 'box_creditcard ' +(hasCards ? 'has_cards' :'') }, style: { display: cardId() == 'new' ? 'block' : 'none' }">
                  
                  <fieldset class="fieldset payment method" data-bind='attr: {id: "payment_form_" + getCode()}'>
                    <div class="fields_text box_text">
                      <p data-bind="i18n: 'All fields are required'"></p>
                    </div>

                    <div class="fields">       
                      <div class="form-group">
                        <label for="form-hf-card-number" data-bind="i18n: 'Card Number'"></label>
                        <input id="form-hf-card-number" type="hostedfield:cardNumber" name="card-number" autocomplete="cc-number" class="form-control form-control-hosted" placeholder="**** **** **** ****" required data-bind="attr:{ disabled: cardId() != 'new' || method() != 'card' }">
                      </div>

                      <div class="form-group-fields">
                        <div class="form-group">
                          <label for="form-hf-card-expiry-date" data-bind="i18n: 'Expiry Date'"></label>
                          <input id="form-hf-card-expiry-date" type="hostedfield:cardExpiryDate" name="card-expiry-date" autocomplete="cc-exp" class="form-control form-control-hosted hf-card-expiry-date" placeholder="MM/YY" required  data-bind="attr:{ disabled: cardId() != 'new' || method() != 'card' }">
                        </div>

                        <div class="form-group">
                          <label for="form-hf-card-cvv" data-bind="i18n: 'Security Code'"></label>
                          <input id="form-hf-card-cvv" type="hostedfield:cardCVV" name="card-cvv" autocomplete="cc-csc" class="form-control form-control-hosted" placeholder="***" required  data-bind="attr:{ disabled: cardId() != 'new' || method() != 'card' }">
                        </div>
                      </div>

                      <!-- ko if: saveCardEnabled -->
                        <div class="form-group">
                          <input type="checkbox" value="1" id="saveCard" name="saveCard" data-bind="checked: saveCard" />
                          <label for="save-card" data-bind="i18n: 'Save Card'"></label>
                        </div>
                      <!-- /ko -->
                    </div>
                  </fieldset>
                </div>
              <!--/ko-->

              <!-- ko foreach: getRegion('messages') -->
                <!-- ko template: getTemplate() --><!-- /ko -->
              <!--/ko-->
            </div>
          <!--/ko-->

          <!-- ko if: hasAvailMethod('applepay') -->
            <!-- ko if: hasMoreMethod() -->
            <div class="box_opnm_radio">
              <label for="inp_opn_method_applepay">
                <input type="radio"
                        id="inp_opn_method_applepay"
                        name="opn_method_id"
                        class="opn_method_id"
                        value="applepay"
                        data-bind="checked: method, event:{ change: changeMethod }" />
                <span data-bind="i18n: 'Apple Pay'"></span>
              </label>
            </div>
            <!--/ko-->
            <div class="box_opn_method" id="box_opn_method_applepay" data-bind="style: { display: method() == 'applepay' ? 'block' : 'none' }">
              <div class="form-group">
                <style>
                  apple-pay-button {
                    --apple-pay-button-width: 240px;
                    --apple-pay-button-height: 40px;
                    --apple-pay-button-border-radius: 5px;
                    --apple-pay-button-padding: 5px 0px;
                    --apple-pay-button-box-sizing: border-box;
                  }
                  </style>
                  <apple-pay-button buttonstyle="black" type="buy" data-bind="event:{ click: onApplePayButtonClicked }" locale="en_US"></apple-pay-button>
                </div>
                <!-- ko foreach: getRegion('messages') -->
                  <!-- ko template: getTemplate() --><!-- /ko -->
                <!--/ko-->
            </div>
          <!--/ko-->

          <!-- ko if: hasAvailMethod('googlepay') -->
            <!-- ko if: hasMoreMethod() -->
            <div class="box_opnm_radio">
              <label for="inp_opn_method_googlepay">
                <input type="radio"
                        id="inp_opn_method_googlepay"
                        name="opn_method_id"
                        class="opn_method_id"
                        value="googlepay"
                        data-bind="checked: method, event:{ change: changeMethod }" />
                <span data-bind="i18n: 'Google Pay'"></span>
              </label>
            </div>
            <!--/ko-->
            <div class="box_opn_method" id="box_opn_method_googlepay" data-bind="style: { display: method() == 'googlepay' ? 'block' : 'none' }">
              <div class="form-group">
                <div id="gpay_button_container"></div>
              </div>
                <!-- ko foreach: getRegion('messages') -->
                  <!-- ko template: getTemplate() --><!-- /ko -->
                <!--/ko-->
            </div>
          <!--/ko-->

          <div class="payment-method-billing-address">
              <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
                  <!-- ko template: getTemplate() --><!-- /ko -->
              <!--/ko-->
          </div>

          <div class="checkout-agreements-block">
              <!-- ko foreach: getRegion('before-place-order') -->
                  <!-- ko template: getTemplate() --><!-- /ko -->
              <!--/ko-->
          </div>
          <div class="actions-toolbar" data-bind="style: { display: displayButton() ? 'block' : 'none' }">
            <div class="primary">
                <button class="action primary checkout" type="submit" data-bind=" attr: {title: $t('Place Order')}">
                  <span data-bind="i18n: 'Place Order'"></span>
              </button>
            </div>
          </div>
        </form>

        <form class="form" style="display: none;" data-bind="attr: {id: getCode() + '-form'}" data-role="qidigital-form">

          <input type="text" name="payment[token]" class="input-text" id="paymentToken" data-bind='value: token'/>
          <div class="actions-toolbar">
            <div class="primary">
              <button class="action primary checkout" type="submit" data-bind="click: placeOrder, attr: {title: $t('Place Order')}">
                <span data-bind="i18n: 'Place Order'"></span>
              </button>
            </div>
          </div>
        </form>

        <div id="opn-embedded-form-container" style="display:none; padding:20px 0; min-height:450px;"></div>

    </div>
</div>
